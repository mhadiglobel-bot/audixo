<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">AUDIXO - Shape every sound</title><desc id="desc">AUDIXO online audio studio. Dark navy banner with cyan, violet, and pink animated sound waves. Record, edit, separate, export.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080e21"/><stop offset=".55" stop-color="#10152e"/><stop offset="1" stop-color="#16133c"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#19e3b6"/><stop offset=".33" stop-color="#31d7f9"/><stop offset=".68" stop-color="#a06dfe"/><stop offset="1" stop-color="#f35dcb"/></linearGradient>
<linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#18213b"/><stop offset="1" stop-color="#191738"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#8f57ed" stop-opacity=".25"/><stop offset="1" stop-color="#8f57ed" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#96a8dd" stroke-opacity=".055" stroke-width="1"/></pattern>
<filter id="blur"><feGaussianBlur stdDeviation="15"/></filter>
</defs>
<style>
.bar{transform-box:fill-box;transform-origin:center;animation:equalize 1.7s ease-in-out infinite alternate}
.scan{stroke-dasharray:36 18;animation:scan 6s linear infinite}
.glow{animation:glow 3.4s ease-in-out infinite}
.dot{animation:dot 2.5s ease-in-out infinite}
@keyframes equalize{from{transform:scaleY(.84)}to{transform:scaleY(1.10)}}
@keyframes scan{to{stroke-dashoffset:-216}}
@keyframes glow{50%{opacity:.62}}
@keyframes dot{50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.bar,.scan,.glow,.dot{animation:none!important}}
</style>
